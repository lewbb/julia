<!doctype html>
<html lang="pt-BR" data-mode="marketing"><head data-k="">
<meta data-k="" charset="utf-8">
<meta data-k="" name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-k="">Julia Ruth | Social media e nail design</title>
<meta data-k="" name="description" content="Criação de artes, vídeos e conteúdo para redes sociais. E unhas com assinatura.">
<link data-k="" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Playfair+Display:ital@0;1&amp;family=Bebas+Neue&amp;family=Caveat:wght@600&amp;family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">
<style data-k="">
:root {
  --bg:#FFFFFF;
  --paper:#FAF8FF;
  --lilac:#DDD1FB;
  --lilac-2:#C4B0F6;
  --violet:#5B34C8;
  --sky:#D3E8FC;
  --sky-2:#A3CFF5;
  --sky-deep:#2A68AA;
  --ink:#1F1737;
  --muted:#655E80;
  --line:rgba(51,27,128,.14);
  --on-accent:#FFFFFF;
  --shadow:rgba(91,52,200,.38);
  --strong-bg:#331B80;
  --strong-ink:#FFFFFF;
  --ph-ink:#331B80;
  --accent:var(--violet);
  --accent-soft:var(--lilac);
  --accent-2:var(--lilac-2);
  --font-display:'Instrument Serif','Times New Roman',serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-mode="nails"] {
  --accent:var(--sky-deep);
  --accent-soft:var(--sky);
  --accent-2:var(--sky-2);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#130F27;
    --paper:#1A1535;
    --lilac:#2C2461;
    --lilac-2:#3D3384;
    --violet:#B9A6FF;
    --sky:#173453;
    --sky-2:#245582;
    --sky-deep:#8EC6F7;
    --ink:#F2EEFF;
    --muted:#ABA3CB;
    --line:rgba(255,255,255,.14);
    --on-accent:#1A1238;
    --shadow:rgba(0,0,0,.55);
    --strong-bg:#2C2461;
    --strong-ink:#F2EEFF;
    --ph-ink:#E4DBFF;
  }
}
:root[data-theme="dark"] {
  --bg:#130F27;
  --paper:#1A1535;
  --lilac:#2C2461;
  --lilac-2:#3D3384;
  --violet:#B9A6FF;
  --sky:#173453;
  --sky-2:#245582;
  --sky-deep:#8EC6F7;
  --ink:#F2EEFF;
  --muted:#ABA3CB;
  --line:rgba(255,255,255,.14);
  --on-accent:#1A1238;
  --shadow:rgba(0,0,0,.55);
  --strong-bg:#2C2461;
  --strong-ink:#F2EEFF;
  --ph-ink:#E4DBFF;
}
html {
  scroll-behavior:smooth;
  scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);
}
*,*::before,*::after {
  box-sizing:inherit;
}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:400 17px/1.6 var(--font-body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button {
  font:inherit;
  color:inherit;
  cursor:pointer;
  background:none;
  border:0;
  padding:0;
}
a {
  color:inherit;
}
img {
  max-width:100%;
}
.slot video,.thumb-prev video {
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
:focus-visible {
  outline:3px solid var(--accent);
  outline-offset:3px;
  border-radius:6px;
}
.serif,h1,h2,h3 {
  font-family:var(--font-display);
  font-weight:400;
}
h1,h2,h3,p {
  margin:0;
}
em {
  font-style:italic;
}
.star {
  width:1em;
  height:1em;
  flex:none;
}
/* barra de progresso + navegação */
.prog {
  position:fixed;
  top:0;
  left:0;
  height:3px;
  width:0;
  background:var(--accent);
  z-index:80;
}
.nav {
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:60;
  display:flex;
  align-items:center;
  gap:18px;
  padding:12px clamp(16px,4vw,40px);
  background:color-mix(in srgb,var(--bg) 84%,transparent);
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
  border-bottom:1px solid transparent;
  transition:border-color .3s;
}
.nav.scrolled {
  border-bottom-color:var(--line);
}
.logo {
  flex:none;
  display:flex;
  align-items:center;
  gap:8px;
  font-family:'Instrument Serif',serif;
  font-style:italic;
  font-size:32px;
  line-height:1;
  color:var(--accent);
}
.logo .star {
  font-size:16px;
}
.links {
  display:flex;
  gap:26px;
  margin-left:auto;
  font-size:15px;
  font-weight:500;
}
.links a {
  text-decoration:none;
  color:var(--muted);
  cursor:pointer;
  padding:6px 0;
  border-bottom:2px solid transparent;
}
.links a:hover {
  color:var(--ink);
  border-bottom-color:var(--accent);
}
.switch {
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  padding:4px;
  border-radius:99px;
  background:var(--accent-soft);
  flex:none;
}
.switch button {
  position:relative;
  z-index:1;
  padding:8px 18px;
  border-radius:99px;
  font-size:14px;
  font-weight:600;
  color:var(--ink);
  transition:color .3s;
}
.switch .thumb {
  position:absolute;
  top:4px;
  bottom:4px;
  left:4px;
  width:calc(50% - 4px);
  border-radius:99px;
  background:var(--accent);
  transition:transform .4s cubic-bezier(.6,0,.2,1);
}
html[data-mode="nails"] .switch .thumb {
  transform:translateX(100%);
}
html[data-mode="marketing"] .switch button[data-mode="marketing"], html[data-mode="nails"] .switch button[data-mode="nails"] {
  color:var(--on-accent);
}
.burger {
  flex:none;
  display:none;
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--accent-soft);
  place-items:center;
}
.burger span,.burger span::before {
  display:block;
  width:18px;
  height:2px;
  background:var(--ink);
  position:relative;
  border-radius:2px;
}
.burger span::before {
  content:'';
  position:absolute;
  top:-6px;
  left:0;
  box-shadow:0 12px 0 var(--ink);
}
.sheet {
  position:fixed;
  inset:0;
  z-index:70;
  background:var(--bg);
  padding:calc(env(safe-area-inset-top,0px) + 84px) 28px 40px;
  display:none;
  flex-direction:column;
  gap:6px;
}
.sheet.open {
  display:flex;
}
.sheet a {
  font-family:'Instrument Serif',serif;
  font-size:44px;
  line-height:1.15;
  text-decoration:none;
  padding:6px 0;
  cursor:pointer;
}
.sheet .x {
  position:absolute;
  top:calc(env(safe-area-inset-top,0px) + 16px);
  right:20px;
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--accent-soft);
  font-size:22px;
}
/* botões */
.btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:15px 26px;
  border-radius:99px;
  background:var(--accent);
  color:var(--on-accent);
  font-weight:600;
  font-size:16px;
  text-decoration:none;
  border:2px solid var(--accent);
  transition:transform .25s, box-shadow .25s;
  cursor:pointer;
}
.btn:hover {
  transform:translateY(-2px);
  box-shadow:0 14px 28px -12px var(--shadow);
}
.btn.ghost {
  background:transparent;
  color:var(--ink);
  border-color:var(--line);
}
.btn.ghost:hover {
  border-color:var(--accent);
}
.btn.sm {
  padding:10px 18px;
  font-size:14px;
}
.row {
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}
/* estrutura */
.world {
  display:block;
}
html[data-mode="marketing"] .world[data-w="nails"], html[data-mode="nails"] .world[data-w="marketing"], html[data-mode="marketing"] [data-w="nails"]:not(.world), html[data-mode="nails"] [data-w="marketing"]:not(.world) {
  display:none !important;
}
.wrap {
  max-width:1240px;
  margin:0 auto;
  padding:clamp(64px,9vw,120px) clamp(18px,5vw,64px);
}
.wrap.tight {
  padding-top:clamp(28px,4vw,48px);
}
h2 {
  font-size:clamp(40px,6vw,78px);
  line-height:.98;
  letter-spacing:-.015em;
  max-width:14ch;
}
h2 em {
  color:var(--accent);
}
.sub {
  color:var(--muted);
  max-width:52ch;
  margin-top:18px;
  font-size:18px;
}
.head {
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:flex-end;
  gap:24px;
  margin-bottom:44px;
}
/* hero */
.hero {
  max-width:1240px;
  margin:0 auto;
  padding:clamp(28px,5vw,60px) clamp(18px,5vw,64px) clamp(56px,7vw,90px);
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:clamp(24px,4vw,64px);
  align-items:center;
  min-height:min(86vh,820px);
}
.hero h1 {
  font-size:clamp(54px,8.6vw,124px);
  line-height:.9;
  letter-spacing:-.025em;
}
.hero h1 em {
  color:var(--accent);
  display:block;
}
.lead {
  font-size:clamp(18px,1.6vw,21px);
  color:var(--muted);
  max-width:46ch;
  margin:26px 0 32px;
}
.hero-art {
  position:relative;
  aspect-ratio:1/1.08;
  width:100%;
  max-width:580px;
  justify-self:center;
}
.frame {
  position:absolute;
  width:56%;
  aspect-ratio:4/5;
  border-radius:6px;
  overflow:hidden;
  background:var(--paper);
  box-shadow:0 34px 60px -24px var(--shadow), 0 0 0 1px var(--line);
  transform:translate3d(calc(var(--mx,0)*var(--d)*1px),calc(var(--my,0)*var(--d)*1px),0) rotate(var(--r));
  animation:toss .9s cubic-bezier(.2,.9,.2,1) both;
  animation-delay:var(--t);
}
.frame.f1 {
  left:0;
  top:0;
  width:50%;
  --r:-7deg;
  --d:10;
  --t:.05s;
}
.frame.f2 {
  right:0;
  top:20%;
  width:50%;
  --r:6deg;
  --d:22;
  --t:.2s;
}
.frame.f3 {
  left:8%;
  bottom:-2%;
  --r:-2deg;
  --d:36;
  --t:.35s;
  width:44%;
}
@keyframes toss {
  from {
    opacity:0;
    translate:0 -60px;
    scale:1.08;
  }
  to {
    opacity:1;
    translate:0 0;
    scale:1;
  }
}
.badge{
  position:absolute;
  right:-2%;
  bottom:6%;
  width:clamp(96px,16vw,136px);
  aspect-ratio:1;
  z-index:3;
  border-radius:50%;
  overflow:hidden;
  display:grid;
  place-items:center;
  transform:translate3d(calc(var(--mx,0)*-30px),calc(var(--my,0)*-30px),0);
}
.badge-logo{
  width:100%;
  height:100%;
  object-fit:cover;
}
.arch-hero {
  border-radius:999px 999px 24px 24px !important;
}
/* marquee */
.marquee {
  overflow:hidden;
  background:var(--accent-soft);
  border-block:1px solid var(--line);
}
.marquee .track {
  display:flex;
  gap:34px;
  width:max-content;
  padding:16px 0;
  animation:mq 34s linear infinite;
  align-items:center;
}
.marquee span {
  font-family:'Instrument Serif',serif;
  font-size:clamp(26px,3.4vw,40px);
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:34px;
  color:var(--ink);
}
.marquee .star {
  font-size:.55em;
  color:var(--accent);
}
@keyframes mq {
  to {
    transform:translateX(-50%);
  }
}
/* placeholders + slots */
.slot {
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
}
.slot img {
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}
.ph {
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  padding:8%;
  text-align:center;
  font-family:'Instrument Serif',serif;
  font-style:italic;
  font-size:clamp(22px,3vw,36px);
  line-height:1.05;
  color:var(--ph-ink);
}
.ph i {
  position:absolute;
  top:9%;
  right:9%;
  font-size:20px;
  opacity:.7;
}
.ph.t1 {
  background:radial-gradient(110% 80% at 15% 8%,rgba(255,255,255,.7),transparent 60%),linear-gradient(160deg,var(--lilac),var(--lilac-2));
}
.ph.t2 {
  background:radial-gradient(110% 80% at 85% 8%,rgba(255,255,255,.7),transparent 60%),linear-gradient(200deg,var(--sky),var(--sky-2));
  color:var(--sky-deep);
}
.ph.t3 {
  background:radial-gradient(90% 70% at 50% 110%,var(--lilac),transparent 70%),var(--paper);
  color:var(--violet);
}
.ph.t4 {
  background:radial-gradient(90% 60% at 80% 0%,rgba(196,176,246,.35),transparent 60%),var(--strong-bg);
  color:var(--strong-ink);
}
.editing .slot,.editing .ba {
  outline:2px dashed var(--accent);
  outline-offset:-4px;
  cursor:copy;
}
.editing .slot::after {
  content:'Trocar imagem';
  position:absolute;
  left:50%;
  bottom:10px;
  translate:-50% 0;
  background:var(--accent);
  color:var(--on-accent);
  font:600 12px 'Hanken Grotesk',sans-serif;
  padding:6px 12px;
  border-radius:99px;
  z-index:5;
  white-space:nowrap;
}
/* flip cards */
.about {
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:clamp(28px,5vw,80px);
  align-items:center;
}
.portrait {
  aspect-ratio:4/5;
  border-radius:999px 999px 28px 28px;
  overflow:hidden;
  box-shadow:0 30px 60px -30px var(--shadow);
}
.about p.big {
  font-family:'Instrument Serif',serif;
  font-size:clamp(28px,3.4vw,46px);
  line-height:1.12;
  letter-spacing:-.01em;
}
.about p.txt {
  color:var(--muted);
  margin-top:20px;
  max-width:52ch;
}
.flips {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-top:64px;
}
.flip {
  perspective:1000px;
  aspect-ratio:3/4;
  text-align:left;
}
.flip-in {
  position:relative;
  display:block;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.3,.7,.2,1);
}
.flip[aria-pressed="true"] .flip-in {
  transform:rotateY(180deg);
}
.face {
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:22px;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border-radius:22px 22px 6px 6px;
}
.face .serif {
  font-size:clamp(26px,2.8vw,38px);
  line-height:1.02;
  font-style:italic;
}
.face small {
  font-size:13px;
  font-weight:600;
  opacity:.75;
}
.face.back {
  transform:rotateY(180deg);
  background:var(--strong-bg);
  color:var(--strong-ink);
  font-size:16px;
  justify-content:flex-end;
  gap:12px;
}
.face.back .star {
  font-size:22px;
  color:var(--lilac-2);
}
.flip:nth-child(1) .front {
  background:var(--lilac);
  color:var(--ph-ink);
}
.flip:nth-child(2) .front {
  background:var(--sky);
  color:var(--sky-deep);
}
.flip:nth-child(3) .front {
  background:var(--paper);
  color:var(--violet);
  box-shadow:inset 0 0 0 2px var(--line);
}
.flip:nth-child(4) .front {
  background:var(--lilac-2);
  color:var(--ph-ink);
}
.flip:nth-child(even) {
  margin-top:28px;
}
/* acordeão */
.split {
  display:grid;
  grid-template-columns:.85fr 1.15fr;
  gap:clamp(28px,5vw,88px);
  align-items:start;
}
.split .stick {
  position:sticky;
  top:110px;
}
.acc-i {
  border-top:1px solid var(--line);
}
.acc-i:last-child {
  border-bottom:1px solid var(--line);
}
.acc-h {
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  padding:24px 0;
  text-align:left;
}
.acc-h .serif {
  font-size:clamp(26px,3vw,38px);
  line-height:1.05;
  transition:color .25s, translate .3s;
}
.acc-h:hover .serif {
  color:var(--accent);
  translate:6px 0;
}
.plus {
  position:relative;
  width:38px;
  height:38px;
  flex:none;
  border-radius:50%;
  background:var(--accent-soft);
  transition:transform .4s, background .3s;
}
.plus::before,.plus::after {
  content:'';
  position:absolute;
  left:50%;
  top:50%;
  width:14px;
  height:2px;
  background:var(--ink);
  translate:-50% -50%;
}
.plus::after {
  rotate:90deg;
  transition:rotate .4s;
}
.acc-i.open .plus {
  background:var(--accent);
  transform:rotate(180deg);
}
.acc-i.open .plus::before,.acc-i.open .plus::after {
  background:var(--on-accent);
}
.acc-i.open .plus::after {
  rotate:0deg;
}
.acc-p {
  display:grid;
  grid-template-rows:0fr;
  transition:grid-template-rows .45s cubic-bezier(.3,.7,.2,1);
}
.acc-i.open .acc-p {
  grid-template-rows:1fr;
}
.acc-p>div {
  overflow:hidden;
}
.acc-p p {
  color:var(--muted);
  padding:0 60px 14px 0;
  max-width:60ch;
}
.acc-p ul {
  margin:0 0 26px;
  padding:0;
  list-style:none;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.acc-p li {
  padding:6px 14px;
  border-radius:99px;
  background:var(--accent-soft);
  font-size:14px;
  font-weight:500;
}
/* portfólio */
.chips {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.chip {
  padding:9px 18px;
  border-radius:99px;
  border:1.5px solid var(--line);
  font-weight:600;
  font-size:14px;
  transition:all .25s;
}
.chip:hover {
  border-color:var(--accent);
}
.chip[aria-pressed="true"] {
  background:var(--accent);
  color:var(--on-accent);
  border-color:var(--accent);
}
.grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}
.tile {
  position:relative;
  display:block;
  text-align:left;
  aspect-ratio:4/5;
  border-radius:6px;
  overflow:hidden;
  box-shadow:0 0 0 1px var(--line);
  transition:transform .4s cubic-bezier(.3,.7,.2,1), box-shadow .4s;
  animation:pop .5s both;
}
.tile:hover {
  transform:translateY(-6px) rotate(-.8deg);
  box-shadow:0 26px 40px -22px var(--shadow), 0 0 0 1px var(--line);
}
.tile-cap {
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:38px 16px 14px;
  color:#fff;
  font-size:14px;
  font-weight:600;
  background:linear-gradient(transparent,rgba(31,23,55,.78));
  opacity:0;
  transition:opacity .3s;
}
.tile:hover .tile-cap,.tile:focus-visible .tile-cap {
  opacity:1;
}
@keyframes pop {
  from {
    opacity:0;
    scale:.96;
  }
  to {
    opacity:1;
    scale:1;
  }
}
.grid.arches {
  grid-template-columns:repeat(4,1fr);
}
.grid.arches .tile {
  border-radius:999px 999px 22px 22px;
  aspect-ratio:3/4.4;
}
.grid.arches .tile:nth-child(4n+2),.grid.arches .tile:nth-child(4n+4) {
  margin-top:34px;
}
.empty {
  grid-column:1/-1;
  padding:40px;
  text-align:center;
  color:var(--muted);
}
/* lightbox */
.lb {
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(19,15,39,.86);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.lb.open {
  display:flex;
}
.lb-card {
  width:min(94vw,860px);
  max-height:92vh;
  display:grid;
  grid-template-columns:1fr 280px;
  background:var(--bg);
  border-radius:14px;
  overflow:hidden;
  animation:pop .3s both;
}
.lb-img {
  position:relative;
  background:var(--paper);
  min-height:280px;
  max-height:86vh;
  aspect-ratio:4/5;
}
.lb-img .slot img {
  object-fit:contain;
  background:var(--paper);
}
.lb-side {
  padding:28px;
  display:flex;
  flex-direction:column;
  gap:12px;
  justify-content:flex-end;
}
.lb-side h3 {
  font-size:34px;
  line-height:1.02;
}
.lb-side p {
  color:var(--muted);
  font-size:15px;
}
.lb-nav {
  display:flex;
  gap:8px;
  margin-top:10px;
}
.round {
  width:46px;
  height:46px;
  border-radius:50%;
  background:var(--accent-soft);
  font-size:20px;
  display:grid;
  place-items:center;
}
.round:hover {
  background:var(--accent);
  color:var(--on-accent);
}
.lb-x {
  position:absolute;
  top:calc(env(safe-area-inset-top,0px) + 16px);
  right:16px;
}
/* processo */
.steps {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:0;
  position:relative;
  margin-bottom:34px;
}
.steps::before {
  content:'';
  position:absolute;
  left:10%;
  right:10%;
  top:27px;
  height:2px;
  background:var(--line);
}
.steps::after {
  content:'';
  position:absolute;
  left:10%;
  top:27px;
  height:2px;
  width:calc(var(--p,0)*80%);
  background:var(--accent);
  transition:width .5s cubic-bezier(.3,.7,.2,1);
}
.st {
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  font-weight:600;
  font-size:15px;
  color:var(--muted);
}
.st b {
  width:56px;
  height:56px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--bg);
  border:2px solid var(--line);
  font-family:'Instrument Serif',serif;
  font-size:26px;
  font-weight:400;
  transition:all .3s;
}
.st[aria-current="step"] {
  color:var(--ink);
}
.st[aria-current="step"] b,.st.done b {
  background:var(--accent);
  border-color:var(--accent);
  color:var(--on-accent);
}
.st.done b {
  opacity:.85;
}
.step-panel {
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:24px 24px 6px 6px;
  padding:clamp(26px,4vw,48px);
  display:grid;
  grid-template-columns:1fr auto;
  gap:24px;
  align-items:end;
  min-height:200px;
}
.step-panel h3 {
  font-size:clamp(34px,4.4vw,56px);
  line-height:1;
}
.step-panel p {
  color:var(--muted);
  margin-top:14px;
  max-width:56ch;
}
/* quiz */
.quiz {
  background:var(--strong-bg);
  color:var(--strong-ink);
  border-radius:32px 32px 8px 8px;
  padding:clamp(26px,5vw,72px);
  display:grid;
  grid-template-columns:.9fr 1.1fr;
  gap:clamp(24px,4vw,64px);
  align-items:center;
  position:relative;
  overflow:hidden;
}
.quiz::before {
  content:'';
  position:absolute;
  width:420px;
  height:420px;
  right:-120px;
  top:-140px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(196,176,246,.45),transparent 70%);
}
.quiz h2 {
  color:var(--strong-ink);
}
.quiz h2 em {
  color:var(--lilac-2);
}
.quiz .sub {
  color:rgba(255,255,255,.75);
}
.qbox {
  position:relative;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);
  border-radius:22px;
  padding:clamp(20px,3vw,34px);
  min-height:340px;
  display:flex;
  flex-direction:column;
  gap:16px;
}
.qtop {
  display:flex;
  justify-content:space-between;
  font-size:14px;
  font-weight:600;
  opacity:.8;
}
.qbar {
  height:4px;
  background:rgba(255,255,255,.2);
  border-radius:4px;
  overflow:hidden;
}
.qbar i {
  display:block;
  height:100%;
  background:var(--lilac-2);
  transition:width .4s;
}
.qq {
  font-family:'Instrument Serif',serif;
  font-size:clamp(28px,3vw,40px);
  line-height:1.05;
}
.qopts {
  display:grid;
  gap:10px;
}
.qo {
  text-align:left;
  padding:15px 18px;
  border-radius:14px;
  background:rgba(255,255,255,.1);
  border:1.5px solid rgba(255,255,255,.18);
  font-weight:500;
  transition:all .25s;
}
.qo:hover {
  background:rgba(255,255,255,.22);
  transform:translateX(6px);
}
.qback {
  align-self:flex-start;
  font-size:14px;
  text-decoration:underline;
  opacity:.8;
}
.qres .serif {
  font-size:clamp(34px,4vw,52px);
  line-height:1;
  font-style:italic;
  color:var(--lilac-2);
}
.qres p {
  opacity:.85;
}
.qbox .btn {
  background:#fff;
  color:#331B80;
  border-color:#fff;
  align-self:flex-start;
}
.qbox .btn.ghost {
  background:transparent;
  color:inherit;
  border-color:rgba(255,255,255,.35);
}
/* contato */
.contact {
  display:grid;
  grid-template-columns:.9fr 1.1fr;
  gap:clamp(28px,5vw,80px);
}
.form {
  display:grid;
  gap:16px;
}
.field label {
  display:block;
  font-size:14px;
  font-weight:600;
  margin-bottom:6px;
}
.field input,.field select,.field textarea {
  width:100%;
  padding:14px 16px;
  border-radius:14px;
  border:1.5px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  font:inherit;
}
.field textarea {
  min-height:120px;
  resize:vertical;
}
.field input:focus,.field select:focus,.field textarea:focus {
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft);
}
.links-col {
  display:grid;
  gap:12px;
  margin-top:28px;
}
.links-col a {
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  padding:14px 18px;
  border-radius:16px;
  background:var(--accent-soft);
  font-weight:600;
  transition:transform .25s;
}
.links-col a:hover {
  transform:translateX(6px);
}
/* portal entre mundos */
.portal {
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:clamp(24px,4vw,44px);
  border-radius:28px 28px 6px 6px;
  background:linear-gradient(120deg,var(--lilac),var(--sky));
}
.portal p {
  font-family:'Instrument Serif',serif;
  font-size:clamp(28px,3.6vw,46px);
  line-height:1.04;
  max-width:22ch;
}
.portal .btn {
  background:var(--ink);
  border-color:var(--ink);
  color:var(--bg);
}
/* unhas: antes/depois + montador */
/* unhas: antes/depois + montador */
.ba {
  position:relative;
  width:100%;
  aspect-ratio:543/700;
  border-radius:28px 28px 6px 6px;
  overflow:hidden;
  --pos:50%;
  user-select:none;
  box-shadow:0 0 0 1px var(--line);
}

.ba-a,
.ba-b {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.ba-a img,
.ba-b img {
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center;
}

.ba .ph span {
  display:none;
}

.ba-b {
  clip-path:inset(0 calc(100% - var(--pos)) 0 0);
}
.ba-a,.ba-b {
  position:absolute;
  inset:0;
}
.ba .ph span {
  display:none;
}
.ba-b {
  clip-path:inset(0 calc(100% - var(--pos)) 0 0);
}
.ba-line {
  position:absolute;
  top:0;
  bottom:0;
  left:var(--pos);
  width:3px;
  margin-left:-1.5px;
  background:#fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.08);
  z-index:3;
}
.ba-knob {
  position:absolute;
  top:50%;
  left:var(--pos);
  translate:-50% -50%;
  width:52px;
  height:52px;
  border-radius:50%;
  background:#fff;
  color:#2A68AA;
  display:grid;
  place-items:center;
  font-weight:700;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
  z-index:4;
}
.ba-range {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  cursor:ew-resize;
  z-index:5;
  margin:0;
}
.editing .ba-range {
  pointer-events:none;
}
.ba-tag {
  position:absolute;
  top:16px;
  z-index:4;
  padding:6px 14px;
  border-radius:99px;
  background:rgba(255,255,255,.9);
  color:#1F1737;
  font-size:13px;
  font-weight:700;
}
.ba-tag.l {
  left:16px;
}
.ba-tag.r {
  right:16px;
}
.price-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}
.price-card {
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:22px 22px 6px 6px;
  padding:26px;
}
.price-card .dur {
  font-size:13px;
  font-weight:600;
  color:var(--muted);
}
.price-card h3 {
  font-size:28px;
  margin-top:6px;
}
.price-card p {
  color:var(--muted);
  margin-top:10px;
  font-size:15px;
}
.price-card .val {
  margin-top:16px;
  padding:12px 16px;
  border-radius:14px;
  background:var(--accent-soft);
  font-weight:700;
  font-size:15px;
}
.price-extra {
  margin-top:36px;
  display:grid;
  grid-template-columns:1.2fr 1.4fr .8fr;
  gap:28px;
  padding:30px;
  border-radius:24px 24px 6px 6px;
  background:var(--strong-bg);
  color:var(--strong-ink);
}
.price-extra h3 {
  font-size:18px;
  margin-bottom:10px;
  font-family:'Hanken Grotesk',sans-serif;
}
.price-extra ul {
  list-style:none;
  margin:0;
  padding:0;
  display:grid;
  gap:8px;
  font-size:14px;
  opacity:.9;
}
.price-extra p {
  font-size:14px;
  opacity:.85;
  margin:0;
}
@media (max-width:980px) {
  .price-grid {
    grid-template-columns:1fr;
  }
  .price-extra {
    grid-template-columns:1fr;
  }
}
/* rodapé */
.cta-foot {
  background:var(--accent-soft);
}
.cta-foot .in {
  max-width:1240px;
  margin:0 auto;
  padding:clamp(48px,7vw,92px) clamp(18px,5vw,64px);
  display:flex;
  flex-wrap:wrap;
  gap:28px;
  justify-content:space-between;
  align-items:center;
}
.cta-foot h2 {
  max-width:16ch;
}
.foot {
  background:var(--strong-bg);
  color:var(--strong-ink);
}
.foot .in {
  max-width:1240px;
  margin:0 auto;
  padding:clamp(44px,6vw,80px) clamp(18px,5vw,64px) 30px;
}
.foot-grid {
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr 1.2fr;
  gap:36px;
}
.foot .logo {
  color:var(--lilac-2);
  font-size:44px;
}
.foot p {
  opacity:.75;
  max-width:32ch;
  margin-top:14px;
  font-size:15px;
}
.foot h4 {
  margin:0 0 14px;
  font-size:15px;
  font-weight:700;
}
.foot ul {
  list-style:none;
  margin:0;
  padding:0;
  display:grid;
  gap:10px;
}
.foot li a {
  text-decoration:none;
  opacity:.78;
  cursor:pointer;
  font-size:15px;
}
.foot li a:hover {
  opacity:1;
  text-decoration:underline;
  text-underline-offset:4px;
}
.foot-bot {
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  gap:12px;
  margin-top:44px;
  padding-top:22px;
  border-top:1px solid rgba(255,255,255,.18);
  font-size:14px;
  opacity:.75;
}
.foot-bot button {
  text-decoration:underline;
  text-underline-offset:4px;
}
/* wipe + toast + edição */
.wipe {
  position:fixed;
  inset:0;
  z-index:95;
  background:var(--accent-soft);
  transform:translateY(101%);
  pointer-events:none;
  display:grid;
  place-items:center;
  font-family:'Instrument Serif',serif;
  font-style:italic;
  font-size:clamp(48px,10vw,120px);
  color:var(--accent);
  visibility:hidden;
}
.wipe.go {
  visibility:visible;
  animation:wipe .9s cubic-bezier(.7,0,.2,1);
}
@keyframes wipe {
  0% {
    transform:translateY(101%);
  }
  40%,60% {
    transform:translateY(0);
  }
  100% {
    transform:translateY(-101%);
  }
}
.toast {
  position:fixed;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom,0px) + 90px);
  translate:-50% 20px;
  opacity:0;
  z-index:120;
  background:var(--ink);
  color:var(--bg);
  padding:12px 20px;
  border-radius:99px;
  font-size:14px;
  font-weight:600;
  pointer-events:none;
  transition:all .35s;
  max-width:90vw;
  text-align:center;
}
.toast.on {
  opacity:1;
  translate:-50% 0;
}
.editbar {
  position:fixed;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  translate:-50% 0;
  z-index:110;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  padding:8px;
  border-radius:22px;
  background:var(--ink);
  color:var(--bg);
  box-shadow:0 20px 40px -12px rgba(0,0,0,.45);
  max-width:94vw;
}
.editbar button {
  padding:10px 16px;
  border-radius:99px;
  font-size:14px;
  font-weight:600;
  background:rgba(255,255,255,.14);
  color:var(--bg);
}
.editbar button.on {
  background:var(--accent-soft);
  color:var(--ink);
}
.editbar button.pub {
  background:var(--accent);
  color:var(--on-accent);
}
.editbar button:disabled {
  opacity:.45;
  cursor:not-allowed;
}
.dlg-bg {
  position:fixed;
  inset:0;
  z-index:130;
  background:rgba(19,15,39,.6);
  display:grid;
  place-items:center;
  padding:20px;
}
.dlg {
  width:min(92vw,420px);
  background:var(--bg);
  border-radius:22px;
  padding:26px;
  display:grid;
  gap:14px;
}
.dlg h3 {
  font-size:34px;
  line-height:1;
}
.dlg .thumb-prev {
  aspect-ratio:16/10;
  border-radius:12px;
  overflow:hidden;
}
.font-list {
  display:grid;
  gap:8px;
}
.font-opt {
  display:grid;
  gap:2px;
  text-align:left;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--paper);
}
.font-opt.on {
  border-color:var(--accent);
  background:var(--accent-soft);
}
.font-opt small {
  color:var(--muted);
  font-size:13px;
}
.adjust-prev {
  width:min(100%,220px);
  aspect-ratio:3/4;
  margin:0 auto;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  display:grid;
  place-items:center;
}
.adjust-prev svg {
  width:100%;
  height:100%;
  display:block;
}
/* ---------- monte o set (recorte de inspiração) ---------- */
.setbuilder {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:clamp(24px,4vw,56px);
  align-items:start;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:32px 32px 8px 8px;
  padding:clamp(20px,4vw,48px);
}
.sb-col h3 {
  font-size:22px;
  margin-bottom:4px;
}
.sb-hint {
  color:var(--muted);
  font-size:14px;
  margin:0 0 14px;
}
.sb-photos {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(72px,1fr));
  gap:10px;
  margin-bottom:22px;
}
.sb-tile {
  position:relative;
  aspect-ratio:1;
  border-radius:14px;
  overflow:hidden;
  background:var(--accent-soft);
}
.sb-tile img {
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  cursor:pointer;
}
.sb-add {
  aspect-ratio:1;
  border-radius:14px;
  border:2px dashed var(--line);
  display:grid;
  place-items:center;
  font-size:28px;
  color:var(--accent);
  background:transparent;
}
.sb-x {
  position:absolute;
  top:4px;
  right:4px;
  width:20px;
  height:20px;
  border-radius:50%;
  background:rgba(19,15,39,.65);
  color:#fff;
  font-size:11px;
  display:grid;
  place-items:center;
  line-height:1;
}
.sb-strip {
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:6px;
  -webkit-overflow-scrolling:touch;
}
.sb-nail {
  position:relative;
  flex:none;
  width:64px;
  height:64px;
  border-radius:14px;
  overflow:hidden;
  border:3px solid transparent;
  cursor:pointer;
}
.sb-nail img {
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.sb-nail[aria-pressed="true"] {
  border-color:var(--accent);
}
.sb-nail .sb-x {
  width:18px;
  height:18px;
  font-size:9px;
}
.sb-empty-note {
  font-size:14px;
  color:var(--muted);
  padding:10px 0;
}
.hand-stage {
  background:var(--accent-soft);
  border-radius:999px 999px 24px 24px;
  padding:8% 8% 4%;
  aspect-ratio:1/1.05;
  display:grid;
  place-items:center;
}
.hand-stage svg {
  width:100%;
  height:auto;
  max-height:100%;
}
.sb-finger {
  cursor:pointer;
}
.hand-stage.picking .sb-finger[data-assigned="0"] {
  animation:sbpulse 1.1s ease-in-out infinite;
}
@keyframes sbpulse {
  0%,100% { opacity:1; }
  50% { opacity:.5; }
}
.sb-picktag {
  margin-top:10px;
  text-align:center;
  font-size:14px;
  color:var(--accent);
  font-weight:600;
  min-height:20px;
}
.crop-dlg {
  width:min(94vw,480px);
}
.crop-stage {
  position:relative;
  width:100%;
  max-height:60vh;
  overflow:auto;
  border-radius:14px;
  background:#111;
}
.crop-inner {
  position:relative;
}
.crop-inner img {
  display:block;
  width:100%;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
}
.crop-box {
  position:absolute;
  border:2px solid #fff;
  box-shadow:0 0 0 2000px rgba(0,0,0,.45);
  touch-action:none;
}
.cb-handle {
  position:absolute;
  width:22px;
  height:22px;
  margin:-11px;
  background:#fff;
  border-radius:50%;
  box-shadow:0 1px 4px rgba(0,0,0,.4);
  touch-action:none;
}
.cb-handle.tl { top:0; left:0; cursor:nwse-resize; }
.cb-handle.tr { top:0; right:0; left:auto; margin-right:-11px; margin-left:0; cursor:nesw-resize; }
.cb-handle.bl { bottom:0; left:0; top:auto; margin-bottom:-11px; margin-top:0; cursor:nesw-resize; }
.cb-handle.br { bottom:0; right:0; top:auto; left:auto; margin:-11px; cursor:nwse-resize; }
.sb-final {
  margin-top:8px;
  text-align:center;
}
.sb-final img {
  max-width:280px;
  width:100%;
  border-radius:16px;
  border:1px solid var(--line);
